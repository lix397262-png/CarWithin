
name: Build CarWithin Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Download upstream source
        run: |
          git clone --depth 1 \
            https://github.com/xmz28/CarWithin.git \
            "$RUNNER_TEMP/CarWithin-upstream"

      - name: Locate Xcode project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""
          WORKSPACE=""
          SOURCE=""

          for ROOT in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/CarWithin-upstream"; do
            P=$(find "$ROOT" \
              \( -name .git -o -name Pods -o -name .build \) -prune \
              -o -type d -name '*.xcodeproj' -print -quit)

            W=$(find "$ROOT" \
              \( -name .git -o -name Pods -o -name .build \) -prune \
              -o -type d -name '*.xcworkspace' -print -quit)

            if [[ -n "$W" ]]; then
              WORKSPACE="$W"
              SOURCE="$ROOT"
              break
            elif [[ -n "$P" ]]; then
              PROJECT="$P"
              SOURCE="$ROOT"
              break
            fi
          done

          if [[ -z "$PROJECT" && -z "$WORKSPACE" ]]; then
            echo "::error::No .xcodeproj or .xcworkspace found."
            echo "Checked repository and upstream repository."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | head -100
            echo "Upstream files:"
            find "$RUNNER_TEMP/CarWithin-upstream" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"

          echo "Found source: $SOURCE"
          echo "Project: $PROJECT"
          echo "Workspace: $WORKSPACE"

      - name: Check scheme
        working-directory: ${{ steps.locate.outputs.source }}
        run: |
          if [[ -n "${{ steps.locate.outputs.workspace }}" ]]; then
            xcodebuild -list -workspace "${{ steps.locate.outputs.workspace }}"
          else
            xcodebuild -list -project "${{ steps.locate.outputs.project }}"
          fi

      - name: Archive unsigned app
        working-directory: ${{ steps.locate.outputs.source }}
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/CarWithin.xcarchive"

          if [[ -n "${{ steps.locate.outputs.workspace }}" ]]; then
            xcodebuild archive \
              -workspace "${{ steps.locate.outputs.workspace }}" \
              -scheme CarWithin \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            xcodebuild archive \
              -project "${{ steps.locate.outputs.project }}" \
              -scheme CarWithin \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP=$(find "$RUNNER_TEMP/CarWithin.xcarchive/Products/Applications" \
            -maxdepth 1 -type d -name '*.app' -print -quit)

          if [[ -z "$APP" ]]; then
            echo "::error::No .app found in archive."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/output/Payload/"

          cd "$GITHUB_WORKSPACE/output"
          ditto -c -k --sequesterRsrc --keepParent \
            Payload CarWithin-unsigned.ipa

          ls -lh CarWithin-unsigned.ipa

      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-unsigned-IPA
          path: output/CarWithin-unsigned.ipa
          if-no-files-found: warn
          retention-days: 7
